# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - Validate Gradle Wrapper.
# - Run 'test' and 'verifyPlugin' tasks.
# - Run Qodana inspections.
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'runPluginVerifier' task.
# - Create a draft release.
#
# The workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main, ij-2024.2 ]
  # Trigger the workflow on any pull request
  pull_request:
  # Manual runs, mainly to exercise the integration-test job without merging (it is push-gated)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:

  # Prepare environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Validate wrapper
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          # The extracted IntelliJ platform (caches/<gradle>/transforms) is ~1.4 GB per job and is
          # re-created from the cached archive in under a minute; caching it as well blew the
          # repository's 10 GB cache budget and evicted everything, so every run downloaded anyway.
          gradle-home-cache-excludes: |
            caches/*/transforms

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Prepare plugin archive content for creating artifact
      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/build/distributions
          FILENAME=`ls *.zip`
          unzip "$FILENAME" -d content

          echo "filename=${FILENAME:0:-4}" >> $GITHUB_OUTPUT

      # Store already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*

  # Run tests and upload a code coverage report
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          # The extracted IntelliJ platform (caches/<gradle>/transforms) is ~1.4 GB per job and is
          # re-created from the cached archive in under a minute; caching it as well blew the
          # repository's 10 GB cache budget and evicted everything, so every run downloaded anyway.
          gradle-home-cache-excludes: |
            caches/*/transforms

      # Run tests
      - name: Run Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew check -x integrationTest

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      # Upload the JaCoCo report to CodeCov
      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml

  # Run the IDE Starter/Driver UI tests. These boot a real IntelliJ (~4 GB download on a cold
  # cache, several minutes per run), so they are kept off pull request builds and run only once a
  # change lands on a release branch.
  integration-test:
    name: Integration tests
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: [ build ]
    runs-on: ubuntu-latest
    # five IDE launches with multi-minute waits each; a hung IDE must not hold the release draft for
    # GitHub's six-hour default
    timeout-minutes: 60
    steps:

      # The IDE (~4 GB) plus a JDK need more room than a hosted runner has spare by default
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          # The extracted IntelliJ platform (caches/<gradle>/transforms) is ~1.4 GB per job and is
          # re-created from the cached archive in under a minute; caching it as well blew the
          # repository's 10 GB cache budget and evicted everything, so every run downloaded anyway.
          gradle-home-cache-excludes: |
            caches/*/transforms

      # The downloaded IDE and JDK dominate the runtime. The test boots the platformVersion from
      # gradle.properties, so hashing that file gives a fresh cache on a platform bump.
      - name: Cache IDE Starter downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/ide-tests/cache
          key: ide-starter-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: ide-starter-${{ runner.os }}-

      # Run integration tests
      - name: Run Integration Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew integrationTest

      # Collect results of failed tests, including the IDE's own logs and screenshots
      - name: Collect Integration Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-tests-result
          path: |
            ${{ github.workspace }}/build/reports/tests/integrationTest
            ${{ github.workspace }}/out/ide-tests/tests/*/*/log

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

     #  Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          # The extracted IntelliJ platform (caches/<gradle>/transforms) is ~1.4 GB per job and is
          # re-created from the cached archive in under a minute; caching it as well blew the
          # repository's 10 GB cache budget and evicted everything, so every run downloaded anyway.
          gradle-home-cache-excludes: |
            caches/*/transforms
          # Read-only: restoring another job's entry gives this one the platform and dependencies.
          # The verifier IDEs are cached separately below rather than through this entry, which
          # would also duplicate the ~2 GB dependency set the build and test jobs already keep.
          cache-read-only: true

      # The verifier IDEs are Gradle dependencies, resolved under the `idea:idea` coordinate - the
      # platform the plugin builds against is `idea:ideaIU`, cached with the dependencies above, so
      # this path holds the verifier's IDEs and nothing else.
      #
      # pluginVerification selects RELEASE channels only (EAP is deliberately absent - see
      # build.gradle.kts), so the set turns over when JetBrains ships a patch release, not with
      # every EAP build. The key therefore rotates monthly on top of gradle.properties, which is
      # what decides the window: one live entry of ~2.4 GB most of the time, two briefly at a
      # rollover, against a 10 GB repository budget.
      - name: Verifier IDE cache key
        id: verifier-ides-key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore verifier IDEs
        id: verifier-ides
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/idea/idea
          key: verifier-ides-${{ runner.os }}-${{ hashFiles('gradle.properties') }}-${{ steps.verifier-ides-key.outputs.month }}
          restore-keys: verifier-ides-${{ runner.os }}-${{ hashFiles('gradle.properties') }}-

      - name: Run Plugin Verification tasks
        # Pull requests verify against the newest release only; a merge to main widens to the
        # last three majors. See pluginVerification in build.gradle.kts.
        #
        # The non-empty value has to sit in the `&&` slot: GitHub treats '' as falsy, so
        # `event == 'pull_request' && '' || '-P...'` falls through to the '-P...' on both sides and
        # every run got the wide scope, pull requests included.
        run: ./gradlew verifyPlugin $SCOPE
        env:
          SCOPE: ${{ github.event_name != 'pull_request' && '-PpluginVerifierScope=last3' || '' }}

      # Only a push to main writes the entry. A pull request's cache is scoped to its own branch,
      # where nothing else can restore it, and a pull request verifies against a subset of what
      # main already holds - so it reads main's entry and writes nothing.
      - name: Save verifier IDEs
        if: ${{ github.event_name != 'pull_request' && steps.verifier-ides.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/idea/idea
          key: verifier-ides-${{ runner.os }}-${{ hashFiles('gradle.properties') }}-${{ steps.verifier-ides-key.outputs.month }}

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, release workflow would be triggered
  releaseDraft:
    name: Release draft
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [ build, test, verify, integration-test ]
    permissions:
      contents: write
    steps:

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true and .name == "v${{ needs.build.outputs.version }}") | .id' \
            | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a new release draft which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            --draft \
            --target ${{ steps.extract_branch.outputs.branch }} \
            --title "v${{ needs.build.outputs.version }}" \
            --notes "$(cat << 'EOM'
          ${{ needs.build.outputs.changelog }}
          EOM
          )"
