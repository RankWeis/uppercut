# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - Validate Gradle Wrapper.
# - Run 'test' and 'verifyPlugin' tasks.
# - Run Qodana inspections.
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'runPluginVerifier' task.
# - Create a draft release.
#
# The workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main, ij-2024.2 ]
  # Trigger the workflow on any pull request
  pull_request:
  # Manual runs, mainly to exercise the integration-test job without merging (it is push-gated)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
# The four build jobs deliberately have no `needs` between them - they fan out from the start.
# Nothing passes data: no job downloads another's artifact, and each restores its own Gradle User
# Home lineage rather than the build job's, so waiting for build never warmed anything. The edges
# only bought fail-fast, at 74s on every green run to save runner minutes on the rare red one.
# Release draft still gates on all four, so nothing ships without them.
jobs:

  # Prepare environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Validate wrapper
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle. Nothing is excluded from the Gradle User Home here, and this is the only job
      # that writes to the cache. The extracted IntelliJ platform (caches/<gradle>/transforms,
      # ~1.4 GB) used to be excluded: caching it as well overran the old 10 GB budget and everything
      # got evicted, so every run re-downloaded regardless. With 25 GB and a single writer it is
      # cached once, and the read-only jobs below restore it rather than each spending a minute
      # re-extracting it from the archive.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Prepare plugin archive content for creating artifact
      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/build/distributions
          FILENAME=`ls *.zip`
          unzip "$FILENAME" -d content

          echo "filename=${FILENAME:0:-4}" >> $GITHUB_OUTPUT

      # Store already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*

  # Run tests and upload a code coverage report
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle. This job writes its own cache entry, ~1.9 GB against the build job's 1.7 GB,
      # the difference being the test and integrationTest classpaths that `buildPlugin` never
      # resolves. It was made read-only when the budget was 10 GB and 6 GB over; restoring the build
      # job's entry instead meant fetching that difference from Maven Central on every run, and the
      # first run that actually did so failed on a 403 from Central - the artifacts were fine, the
      # repository just had a bad minute. Two GB is not worth a build that breaks when Central
      # hiccups, now that the budget is 25 GB.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      # Run tests
      - name: Run Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew check -x integrationTest

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      # Upload the JaCoCo report to CodeCov
      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml

  # Run the IDE Starter/Driver UI tests. These boot a real IntelliJ (~4 GB download on a cold
  # cache, several minutes per run), so they are kept off pull request builds and run only once a
  # change lands on a release branch.
  integration-test:
    name: Integration tests
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # No free-disk-space step here either - see the note in the verify job. This one was costing
    # 36s for the same non-problem.
    # five IDE launches with multi-minute waits each; a hung IDE must not hold the release draft for
    # GitHub's six-hour default
    timeout-minutes: 60
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle. Writes its own entry too, for the same reason as the test job: it resolves the
      # integrationTest classpath, which nothing else does, and fetching that from Maven Central on
      # every run is a network dependency the build does not need.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      # The downloaded IDE and JDK dominate the runtime, so this cache is the one that matters for
      # this job. What it holds depends on a single value - integrationPlatformVersion, falling back
      # to platformVersion, which is how build.gradle.kts decides the IDE the Starter boots - not on
      # the whole of gradle.properties. Hashing the file threw the ~1.7 GB IDE away on any property
      # bump: karateVersion 1.5.1 -> 1.5.2 missed this cache and re-downloaded an IDE that had not
      # changed. ui-tests-latest.yml already keys on the version it boots; this now matches.
      - name: IDE Starter platform version
        id: starter-platform
        run: |
          v=$(grep -E '^[[:space:]]*integrationPlatformVersion[[:space:]]*=' gradle.properties \
            | head -1 | cut -d= -f2- | tr -d ' ')
          [ -n "$v" ] || v=$(grep -E '^[[:space:]]*platformVersion[[:space:]]*=' gradle.properties \
            | head -1 | cut -d= -f2- | tr -d ' ')
          if [ -z "$v" ]; then echo "no platform version in gradle.properties" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache IDE Starter downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/ide-tests/cache
          key: ide-starter-${{ runner.os }}-${{ steps.starter-platform.outputs.version }}
          restore-keys: ide-starter-${{ runner.os }}-

      # Run integration tests
      - name: Run Integration Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew integrationTest

      # Collect results of failed tests, including the IDE's own logs and screenshots
      - name: Collect Integration Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-tests-result
          path: |
            ${{ github.workspace }}/build/reports/tests/integrationTest
            ${{ github.workspace }}/out/ide-tests/tests/*/*/log

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    # Push only, and nothing waits on it. It checks the plugin against the newest release and the
    # newest EAP; an EAP failure is information about a platform still in flux, not a reason to
    # stop a release. Release draft deliberately does not list it in `needs`.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # No free-disk-space step here. It used to run because "the IDE (~4 GB) plus a JDK need more
    # room than a hosted runner has spare by default", which stopped being true: a hosted ubuntu
    # runner reports 87 GB free before any cleanup, and this job needs perhaps 12 GB. The step was
    # spending 98s of a 333s job reclaiming 22 GB nobody wanted.
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: zulu
          java-version: 25

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          # Read-only: restoring another job's entry gives this one the platform and dependencies,
          # and this job has no dependency set of its own worth a second whole entry.
          cache-read-only: true

      # The verifier IDEs are downloaded fresh each run, on purpose.
      #
      # They were cached between 2026-09-06 and this commit, keyed on gradle.properties with a
      # monthly rotation, and it did not pay: the one measured run that restored the entry took
      # 576s against 532s for the cold run before it, so restoring ~3.2 GB cost about what
      # downloading and extracting it had. The entry was the largest single item in the cache and
      # bought nothing measurable, and the extracted platform (gradle-transforms-v2) is cached
      # separately and is unaffected by this.
      #
      # Before trying this again, measure first: several runs each way, not one.
      - name: Run Plugin Verification tasks
        # No scope flag: the default window is the newest release plus the newest EAP. The wider
        # backward sweep is `-PpluginVerifierScope=last3` or `=all`, run by hand before a release.
        # See pluginVerification in build.gradle.kts.
        run: ./gradlew verifyPlugin

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, release workflow would be triggered
  releaseDraft:
    name: Release draft
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [ build, test, integration-test ]
    permissions:
      contents: write
    steps:

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true and .name == "v${{ needs.build.outputs.version }}") | .id' \
            | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a new release draft which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            --draft \
            --target ${{ steps.extract_branch.outputs.branch }} \
            --title "v${{ needs.build.outputs.version }}" \
            --notes "$(cat << 'EOM'
          ${{ needs.build.outputs.changelog }}
          EOM
          )"
