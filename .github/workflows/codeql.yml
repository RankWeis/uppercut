name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      # The manual build below resolves the IntelliJ platform (~2 GB). Without this the CodeQL job
      # downloads it from scratch on every run, since it is the one workflow here that builds
      # without setting Gradle up. Read-only: build.yml populates these entries, and this job must
      # not add a third copy to the repository's 10 GB cache budget.
      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # --no-build-cache is load-bearing. The Setup Gradle step above restores the build cache
      # along with the dependencies, and CodeQL builds its database by tracing an actual javac
      # run: with a warm build cache every compile task comes back FROM-CACHE, nothing is compiled,
      # and `database finalize` fails with "CodeQL detected code written in Java/Kotlin but this
      # run didn't build any of it" (exit 32). The cache is still worth restoring - it is what
      # keeps this job from re-downloading the ~2 GB platform - but the compile has to be real.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: ./gradlew classes --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
